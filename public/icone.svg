<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Quizzer">
  <!--
    A marca do Quizzer: um ponto de interrogação desenhado com traço, não com
    texto. Fonte em favicon é aposta — o navegador desenha com a fonte que
    tiver, e num aparelho sem ela o ícone sai diferente. Traço é traço em
    qualquer lugar.

    O pingo é dourado, e é o único ponto de cor: é o que distingue o ícone de
    uma interrogação genérica quando ele aparece com 16px na aba.
  -->
  <rect width="100" height="100" rx="22" fill="#2e4268"/>
  <path d="M34 35 A16 16 0 1 1 50 51 L50 63"
        fill="none" stroke="#ffffff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="79" r="5.5" fill="#e0a536"/>
</svg>
