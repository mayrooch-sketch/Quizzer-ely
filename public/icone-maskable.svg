<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Quizzer">
  <!--
    Variante recortável: o sistema pode cortar o ícone em círculo, folha ou
    gota, e só os 80% do meio sobrevivem com certeza. A marca vem menor para
    caber nessa zona; o fundo é o mesmo e vai até a borda.
  -->
  <rect width="100" height="100" fill="#2e4268"/>
  <g transform="translate(50 50) scale(0.72) translate(-50 -50)">
    <path d="M34 35 A16 16 0 1 1 50 51 L50 63"
          fill="none" stroke="#ffffff" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="79" r="5.5" fill="#e0a536"/>
  </g>
</svg>
